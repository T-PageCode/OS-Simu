<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OS Simu v2</title>
    <style>
        body,html{
            background-color: rgb(0,100,150);
            width: 100%;
            height: 100%;
        }
        *{
            font-family: "Simsun","宋体",serif;
            user-select: none;
            margin: 0;
        }
        #background-text{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            color: white;
            font-size: 50px;
        }
        #taskbar{
            position: absolute;
            bottom: 0;
            left: 0;
            background-color: rgb(100,100,100);
            width: 100%;
            height: 50px;
        }
        #menu{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            font-size: 20px;
            color: white;
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80%;
            background-color: rgb(140,140,140);
        }
        #menu:hover{
            background-color: rgb(120,120,120);
        }
        #menu:active{
            border: 2px solid white;
        }
        #menu-div{
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgb(100,100,100);
            width: 750px;
            height: 500px;
            visibility: hidden;
        }
        #menu-div.show{
            visibility: visible;
        }
        .menu-item{
            margin-left: 550px;
            width: 200px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            color: white;
        }
        .menu-item:hover{
            background-color: rgb(0,50,0);
            color: white;
        }
        #menu-os-simu{
            position: absolute;
            top: 50%;
            left: 300px;
            transform: translate(-50%,-50%);
            font-size: 60px;
            color: white;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <h1 id="background-text">OS SIMU V2</h1>
    <div id="taskbar">
        <div id="menu">菜单</div>
    </div>
    <div id="menu-div">
        <div class="menu-item" onclick="window.open('https://t-pagecode.github.io')">T-PageCode主页</div>
        <div class="menu-item" onclick="window.open('https://t-pagecode.github.io/T-CodeSystem')">T-CodeSystem</div>
        <div class="menu-item" onclick="window.open('https://codeberg.org/T-PageCode')">Codeberg</div>
        <div class="menu-item" onclick="window.open('https://gitcode.com/T-PageCode')">GitCode</div>
        <div class="menu-item" onclick="window.open('https://github.com/T-PageCode')">GitHub</div>
        <div class="menu-item" onclick="window.open('https://gitea.com/T-PageCode')">Gitea</div>
        <div class="menu-item" onclick="window.open('https://gitee.com/T-PageCode')">Gitee</div>
        <div class="menu-item" onclick="window.location.href='./index.html'">关闭系统</div>
        <div class="menu-item" onclick="window.location.href='./v1.html'">切换到V1版本</div>
        <div class="menu-item" onclick="window.location.href='./v3.html'">切换到V3版本</div>
        <h1 id="menu-os-simu">OS SIMU V2</h1>
    </div>
    <script>
        document.addEventListener("contextmenu",(e) => {
            e.preventDefault();
        })
        const menu = document.getElementById("menu");
        const menuDiv = document.getElementById("menu-div");
        menu.onclick = () => {
            menuDiv.classList.toggle("show");
        }
        document.body.onclick = (e) => {
            if (e.target.closest("#menu") || e.target.closest("#menu-div")) {
                return;
            }
            menuDiv.classList.remove("show");
        }
    </script>
</body>
</html>
