<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OS Simu v16</title>
    <style>
        body,html{
            background-color: rgb(0,200,100);
            width: 100%;
            height: 100%;
        }
        *{
            font-family: sans-serif;
            user-select: none;
            margin: 0;
        }
        #background-text{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            color: white;
            font-size: 50px;
        }
        #taskbar{
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background-color: rgb(255,255,255,0.3);
            backdrop-filter: blur(10px);
            width: auto;
            height: 60px;
            border-radius: 20px;
        }
        #menu{
            position: absolute;
            top: 50%;
            left: calc(50% - 60px);
            transform: translate(-50%,-50%);
            font-size: 20px;
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 70%;
            background-color: rgba(255,255,255,0.5);
            color: black;
            border-radius: 15px;
            border: 2px solid transparent;
            transition: background-color 0.3s ease,
            color 0.3s ease,
            border-color 0.3s ease,
            transform 0.3s ease;
            z-index: 1;
        }
        #menu:hover{
            background-color: rgb(0,150,50);
            color: white;
        }
        #menu:active{
            border-color: rgb(0,0,0);
            transform: translate(-50%,-50%) perspective(800px) rotateX(-20deg) rotateY(-20deg) scale(0.8);
        }
        #menu-div{
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translate(-50%,10%) perspective(800px) rotateX(40deg) rotateY(40deg);
            background-color: rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
            width: 750px;
            height: 500px;
            visibility: hidden;
            opacity: 0;
            border-radius: 20px;
            z-index: 0;
            transition: opacity 0.3s ease,
            transform 0.3s ease;
            overflow: hidden;
        }
        #menu-div.show{
            opacity: 1;
            transform: translateX(-50%);
        }
        .menu-item{
            width: 200px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: black;
            border-radius: 15px;
            transition: background-color 0.3s ease,
            color 0.3s ease,
            transform 0.3s ease;
        }
        .menu-item:hover{
            background-color: rgb(0,150,50);
            color: white;
        }
        .menu-item:active{
            transform: scale(0.8);
        }
        #menu-os-simu{
            position: absolute;
            bottom: 0px;
            left: calc(50% + 40px);
            transform: translate(-50%,-50%);
            font-size: 30px;
            color: black;
            white-space: nowrap;
        }
        #contextmenu{
            position: fixed;
            transform: perspective(800px) rotateX(-40deg) rotateY(-40deg);
            width: 170px;
            height: auto;
            background-color: rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
            visibility: hidden;
            border-radius: 15px;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s ease,
            transform 0.3s ease;
        }
        .contextmenu-item{
            text-align: center;
            width: 100%;
            height: 43px;
            line-height: 45px;
            border-radius: 15px;
            font-size: 17px;
            transition: background-color 0.3s ease,
            color 0.3s ease,
            transform 0.3s ease;
            color: black;
        }
        .contextmenu-item:hover{
            background-color: rgb(0,100,50);
            color: white;
        }
        .contextmenu-item:active{
            transform: scale(0.8);
        }
        #time{
            position: absolute;
            top: 50%;
            left: calc(50% + 60px);
            transform: translate(-50%,-50%);
            font-size: 25px;
            color: black;
        }
        #menu-hour{
            position: absolute;
            top: calc(50% - 80px);
            left: calc(50% + 20px);
            transform: translate(-50%,-50%);
            font-size: 100px;
            color: black;
        }
        #menu-minute{
            position: absolute;
            top: calc(50% + 15px);
            left: calc(50% + 60px);
            transform: translate(-50%,-50%);
            font-size: 100px;
            color: black;
        }
        #menu-date{
            position: absolute;
            top: calc(50% + 90px);
            left: calc(50% + 35px);
            transform: translate(-50%,-50%);
            font-size: 25px;
            color: black;
        }
    </style>
</head>
<body>
    <h1 id="background-text">OS Simu V16</h1>
    <div id="taskbar">
        <div id="menu">菜单</div>
        <p id="time"></p>
    </div>
    <div id="menu-div">
        <div class="menu-item" onclick="window.open('https://t-pagecode.github.io')">T-PageCode主页</div>
        <div class="menu-item" onclick="window.open('https://t-pagecode.github.io/T-CodeSystem')">T-CodeSystem</div>
        <div class="menu-item" onclick="window.open('https://codeberg.org/T-PageCode')">Codeberg</div>
        <div class="menu-item" onclick="window.open('https://gitcode.com/T-PageCode')">GitCode</div>
        <div class="menu-item" onclick="window.open('https://github.com/T-PageCode')">GitHub</div>
        <div class="menu-item" onclick="window.open('https://gitea.com/T-PageCode')">Gitea</div>
        <div class="menu-item" onclick="window.open('https://gitee.com/T-PageCode')">Gitee</div>
        <div class="menu-item" onclick="window.location.href='./index.html'">关闭系统</div>
        <div class="menu-item" onclick="window.open('https://t-pagecode.github.io/Downloads')">下载中心</div>
        <div class="menu-item" onclick="window.location.href='./v15.html'">切换到V15版本</div>
        <h1 id="menu-hour"></h1>
        <h1 id="menu-minute"></h1>
        <p id="menu-date"></p>
        <p id="menu-os-simu">OS Simu V16</p>
    </div>
    <div id="contextmenu">
        <div class="contextmenu-item" onclick="window.location.reload()">刷新</div>
        <div class="contextmenu-item" onclick="window.location.href='./index.html'">关闭系统</div>
        <div class="contextmenu-item" onclick="window.open('https://gitee.com/T-PageCode')">Gitee</div>
        <div class="contextmenu-item" onclick="window.open('https://gitea.com/T-PageCode')">Gitea</div>
        <div class="contextmenu-item" onclick="window.open('https://github.com/T-PageCode')">GitHub</div>
        <div class="contextmenu-item" onclick="window.open('https://gitcode.com/T-PageCode')">GitCode</div>
        <div class="contextmenu-item" onclick="window.open('https://codeberg.org/T-PageCode')">Codeberg</div>
        <div class="contextmenu-item" onclick="window.location.href='./v15.html'">切换到V15版本</div>
    </div>
    <script>
        const contextmenu = document.getElementById("contextmenu");
        let menuDivTime = null;
        let contextmenuTime = null;
        document.addEventListener("contextmenu",(e) => {
            clearTimeout(contextmenuTime);
            e.preventDefault();
            let x = e.clientX + "px";
            let y = e.clientY + "px";
            contextmenu.style.visibility = "visible";
            contextmenu.style.opacity = "1";
            contextmenu.style.left = x;
            contextmenu.style.top = y;
            contextmenu.style.transform = "none";
        })
        document.addEventListener("mousedown",(e) => {
            if (e.target.closest("#contextmenu")) {
                return;
            }
            clearTimeout(contextmenuTime);
            contextmenu.style.opacity = "0";
            contextmenu.style.transform = "";
            contextmenuTime = setTimeout(() => {
                contextmenu.style.visibility = "hidden";
            },300)
        })
        const menu = document.getElementById("menu");
        const menuDiv = document.getElementById("menu-div");
        menu.onclick = () => {
            if (menuDiv.classList.contains("show")) {
                clearTimeout(menuDivTime);
                menuDiv.classList.remove("show");
                menuDivTime = setTimeout(() => {
                    menuDiv.style.visibility = "hidden";
                },300)
            }
            else {
                clearTimeout(menuDivTime);
                menuDiv.style.visibility = "visible";
                menuDiv.classList.add("show");
            }
        }
        document.body.onclick = (e) => {
            if (e.target.closest("#menu") || e.target.closest("#menu-div")) {
                return;
            }
            clearTimeout(menuDivTime);
            menuDiv.classList.remove("show");
            menuDivTime = setTimeout(() => {
                menuDiv.style.visibility = "hidden";
            },300)
        }
        const time = document.getElementById("time");
        const menuHour = document.getElementById("menu-hour");
        const menuMinute = document.getElementById("menu-minute");
        const menuDate = document.getElementById("menu-date");
        function updateTime() {
            let lists = ["日","一","二","三","四","五","六"];
            let getTime = new Date();
            let month = getTime.getMonth() + 1;
            let date = getTime.getDate();
            let day = getTime.getDay();
            let hour = getTime.getHours();
            let minute = getTime.getMinutes();
            let second = getTime.getSeconds();
            hour = hour.toString().padStart("2",0);
            minute = minute.toString().padStart("2",0);
            second = second.toString().padStart("2",0);
            time.innerText = `${hour}:${minute}:${second}`;
            menuHour.innerText = hour;
            menuMinute.innerText = minute;
            menuDate.innerText = `${month}月${date}日 · 星期${lists[day]}`;
        }
        setInterval(updateTime,200);
    </script>
</body>
</html>
